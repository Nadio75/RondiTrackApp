swagger_parser:
  schema_path: ../contract/openapi/v1.json
  output_directory: lib/core/network/generated
  name: ronditrack_api
  language: dart
  json_serializer: json_serializable
  default_content_type: application/json
  path_method_name: true
  unknown_enum_value: true
  root_client: true
  export_file: true
  include_paths:
    - /api/v1/me
    - /api/v1/me/home
    - /api/v1/stokvels
    - /api/v1/stokvels/{id}
    - /api/v1/stokvels/{id}/members
    - /api/v1/stokvels/{id}/contributions
    - /api/v1/stokvels/{stokvelId}/cycles
    - /api/v1/stokvels/{stokvelId}/cycles/{cycleId}
    - /api/v1/stokvels/{id}/cycles/{cycleId}/payout-rotation
    - /api/v1/stokvels/{id}/cycles/{cycleId}/payout
    - /api/v1/activity
    - /api/v1/auth/login
    - /api/v1/auth/refresh
    - /api/v1/auth/logout
